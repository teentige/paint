version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: paint-stock-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paint_stock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paint_stock"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: paint-stock-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/paint_stock
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
